name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Oracle 서버에 SSH로 배포
        uses: appleboy/ssh-action@v1
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_URL
          command_timeout: "30m"
          script: |
            set -e
            cd /home/ubuntu/skinforge

            if [ ! -d .git ]; then
              git init
              git remote add origin "$REPO_URL"
            fi

            git fetch origin main
            git reset --hard origin/main

            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "APP_USER=${{ secrets.APP_USER }}" >> .env
            echo "APP_PW=${{ secrets.APP_PW }}" >> .env

            # nginx 타임아웃 설정 업데이트
            sudo cp nginx-skinforge.conf /etc/nginx/sites-available/skinforge 2>/dev/null || true
            sudo nginx -t && sudo systemctl reload nginx || true

            set +e
            docker compose down --remove-orphans 2>/dev/null
            docker stop skinforge 2>/dev/null
            docker rm -f skinforge 2>/dev/null
            docker ps -aq --filter name=skinforge | xargs -r docker rm -f 2>/dev/null
            docker network rm skinforge_default 2>/dev/null
            set -e
            docker compose up -d --build --force-recreate
